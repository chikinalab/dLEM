site_name: differentiable Loop Extrusion Model

nav:
  - Home: README.md
  - Installation: installation.md
  - Tutorials:
    - CLI usage: cli_usage.ipynb
    - Train and Analyze: train_analyze_example.ipynb
    - Synthetic Data: synthetic_data.ipynb
  - CLI Reference: cli_reference.md 
  - Python API Reference: api_reference.md 
  - Core Reference: core_reference.md 

theme: 
  name: material
  logo: assets/icon.png
  favicon: assets/icon.png
  palette:
  - scheme: default
    primary: teal
    accent: deep orange
    toggle:
      icon: material/toggle-switch
      name: Switch to dark mode
  - scheme: slate
    toggle:
      icon: material/toggle-switch-off-outline
      name: Switch to light mode

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [dlem]
          options:
            docstring_options:
              ignore_init_summary: true
            docstring_style: google
            signature_crossrefs: true
            unwrap_annotated: true
            inherited_members: true
            summary: true
            heading_level: 2
            parameter_headings: true
            type_parameter_headings: true
            show_root_heading: true
            show_root_full_path: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            line_length: 88
            merge_init_into_class: true
            separate_signature: true
            show_signature_annotations: true
            show_signature_type_parameters: true
            show_bases: false
  - mkdocs-jupyter   

exclude_docs: | 
  *.cool